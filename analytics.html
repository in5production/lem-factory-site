<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LEM Factory — Analytics System</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    padding: 30px;
  }
  h1 { text-align: center; }
  .container {
    max-width: 800px;
    margin: auto;
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.1);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  input, select {
    padding: 10px;
    width: 100%;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
  }
  .btn {
    margin-top: 25px;
    width: 100%;
    padding: 14px;
    background: #000;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
  }
  .result-box {
    margin-top: 28px;
    background: #000;
    color: #fff;
    padding: 22px;
    border-radius: 12px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
  }
</style>

</head>
<body>

<h1>LEM Advertising Evaluation System</h1>

<div class="container">
  
  <div class="grid">
    <div>
      <label>Visits</label>
      <input id="visits" type="number" placeholder="e.g. 1200">
    </div>

    <div>
      <label>Add to Cart</label>
      <input id="addcart" type="number">
    </div>

    <div>
      <label>Orders</label>
      <input id="orders" type="number">
    </div>

    <div>
      <label>CTR (%)</label>
      <input id="ctr" type="number" step="0.01">
    </div>

    <div>
      <label>CPA (BD)</label>
      <input id="cpa" type="number" step="0.01">
    </div>

    <div>
      <label>Comments</label>
      <input id="comments" type="number">
    </div>

    <div>
      <label>Activity (Likes + Shares)</label>
      <input id="activity" type="number">
    </div>

    <div>
      <label>Price</label>
      <input id="price" type="number" step="0.1">
    </div>

    <div>
      <label>Country</label>
      <input id="country" type="text" placeholder="e.g. Bahrain">
    </div>
  </div>

  <button class="btn" onclick="evaluate()">Evaluate Performance</button>

  <div id="result" class="result-box" style="display:none;">
  </div>

</div>


<script>
function evaluate() {

  let visits = Number(document.getElementById("visits").value);
  let addcart = Number(document.getElementById("addcart").value);
  let orders = Number(document.getElementById("orders").value);
  let ctr = Number(document.getElementById("ctr").value);
  let cpa = Number(document.getElementById("cpa").value);
  let comments = Number(document.getElementById("comments").value);
  let activity = Number(document.getElementById("activity").value);

  let resultBox = document.getElementById("result");
  resultBox.style.display = "block";

  // ---- RULES ----

  // BAD
  if (visits >= 1000 && orders == 0 && addcart == 0 && ctr < 0.8) {
    resultBox.style.background = "#b91c1c";
    resultBox.textContent =
      "RESULT: ❌ BAD\n1,000+ visits, 0 orders, 0 add-to-cart, CTR < 0.8%";
    return;
  }

  // GOOD
  if (
    (orders >= 1 && orders / 1 >= 1) || // 1 order daily
    (orders >= 3) || // 3 weekly
    (addcart >= 3) ||
    (cpa > 0 && cpa <= 3) // CPA under 5–3 BD
  ) {
    resultBox.style.background = "#16a34a";
    resultBox.textContent =
      "RESULT: ✅ GOOD\nStrong add-to-cart, daily orders, or CPA under 5-3 BD.";
    return;
  }

  // MEDIUM
  if (
    (orders >= 1) ||
    (addcart >= 1) ||
    (comments > 0 || activity > 0)
  ) {
    resultBox.style.background = "#f59e0b";
    resultBox.textContent =
      "RESULT: 🟡 MEDIUM\nYou have some activity or 1–3 day orders.";
    return;
  }

  // DEFAULT
  resultBox.style.background = "#4b5563";
  resultBox.textContent = "RESULT: No enough data.";
}
</script>

</body>
</html>
