<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LEM Factory — Energy Drinks & Cubes</title>
  <meta name="description" content="LEM Factory — sugar-free fitness & performance energy drinks and cubes." />

  <!-- ================= META PIXEL ================= -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '785081037921589');
  fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=785081037921589&ev=PageView&noscript=1"/>
  </noscript>
  <!-- =============== END META PIXEL =============== -->

  <!-- ================= GA4 (CORRECT) ================= -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0323KWZJW9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0323KWZJW9');
  </script>
  <!-- =============== END GA4 ================= -->

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<!-- CART ICON -->
<div id="cart-icon">🛒 <span id="cart-count">0</span></div>

<!-- PRODUCTS -->
<button class="add-btn" data-product="Lime Energy" data-price="1">Add to Cart</button>

<script>
/* ================= CART + GA4 EVENTS ================= */
const CART_KEY = 'lemfactory_cart_v1';
let cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');

document.querySelectorAll('.add-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const product = btn.dataset.product;
    const price = Number(btn.dataset.price);

    cart.push({ name: product, price });
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    document.getElementById('cart-count').textContent = cart.length;

    // GA4 EVENT
    gtag('event', 'add_to_cart', {
      currency: 'USD',
      value: price,
      items: [{ item_name: product, price, quantity: 1 }]
    });

    // META EVENT
    fbq('track', 'AddToCart', { value: price, currency: 'USD' });
  });
});
</script>

</body>
</html>
