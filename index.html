  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',

  </script>

      src="https://www.facebook.com/tr?id=785081037921589&ev=PageView&noscript=1"/>

  <!-- ================= GA4 (FINAL / CORRECT) ================= -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0323KWZJW9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0323KWZJW9');
  </script>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<!-- Floating Cart -->
<div id="cart-icon" style="position:fixed;right:18px;top:18px;z-index:1200;background:#ffbf00;padding:10px 14px;border-radius:24px;cursor:pointer">
  🛒 <span id="cart-count">0</span>
</div>

<header class="site-header fixed">
  <div class="container header-inner">
    <a class="brand" href="#home">
      <img src="LemLogo.png" class="logo">
      <span>LEM Factory</span>
    </a>
  </div>
</header>

<main>

<section class="hero" id="home">
  <h1>LEM Factory — Natural Energy, Smart Performance</h1>
  <p>Sugar-free fitness & performance energy drinks and cubes</p>
</section>

<section id="drinks">
  <h2>LEM Energy Drinks</h2>

  <button class="add-btn" data-product="Lime Energy" data-price="1">Add Lime Energy</button>
  <button class="add-btn" data-product="Berry Boost" data-price="1">Add Berry Boost</button>
  <button class="add-btn" data-product="Night Focus" data-price="1">Add Night Focus</button>
</section>

</main>

<footer>
  <p>&copy; LEM Factory</p>
</footer>

<script>
/* ================= CART + ANALYTICS ================= */
const CART_KEY = 'lemfactory_cart_v1';
let cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
document.getElementById('cart-count').textContent = cart.length;

document.querySelectorAll('.add-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const name = btn.dataset.product;
    const price = Number(btn.dataset.price);

    cart.push({ name, price });
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    document.getElementById('cart-count').textContent = cart.length;

    // GA4
    gtag('event', 'add_to_cart', {
      currency: 'USD',
      value: price,
      items: [{ item_name: name, price, quantity: 1 }]
    });

    // Meta
    fbq('track', 'AddToCart', { value: price, currency: 'USD' });
  });
});
</script>

</body>
</html>
