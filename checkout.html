<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Checkout — LEM Factory</title>

  <!-- ===== META PIXEL ===== -->

  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '785081037921589');

  </script>

  <!-- ===== GOOGLE ANALYTICS GA4 (CORRECT) ===== -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0323KWZJW9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0323KWZJW9');
  </script>
  <!-- ===== END GA4 ===== -->

  <style>
    body { font-family: Inter, system-ui, sans-serif; padding:40px; background:#f7f8fa; color:#0b1220; }
    .box { max-width:720px; margin:40px auto; background:#fff; padding:28px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.06); text-align:center; }
    h1 { margin-bottom:12px; }
    p.lead { color:#6b7280; margin-bottom:18px; }
    .items { text-align:left; margin:18px 0; }
    .btn { background:#ffbf00; padding:10px 18px; border-radius:10px; display:inline-block; text-decoration:none; color:#000; font-weight:700; margin-top:16px; }
    .warning { color:#b91c1c; font-weight:700; margin-top:16px; }
  </style>
</head>

<body>
  <div class="box">
    <h1>Checkout</h1>
    <p class="lead">The checkout flow is currently a demo. We show your cart below.</p>

    <div id="cart-items" class="items"></div>

    <div class="warning">
      Important: This product is currently not available in your country.
    </div>

    <a href="index.html" class="btn">Return to Shop</a>
  </div>

  <script>
    const CART_KEY = 'lemfactory_cart_v1';
    const items = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
    const list = document.getElementById('cart-items');

    let total = 0;
    if (items.length === 0) {
      list.innerHTML = '<p>Your cart is empty.</p>';
    } else {
      list.innerHTML =
        '<ul>' +
        items.map((it,i)=>{
          total += parseFloat(it.price||1);
          return `<li>${i+1}. ${it.name} — $${parseFloat(it.price||1).toFixed(2)}</li>`;
        }).join('') +
        `</ul><p><strong>Total: $${total.toFixed(2)}</strong></p>`;
    }

    if (typeof gtag === 'function') {
      gtag('event', 'begin_checkout', { currency:'USD', value: total });
    }
    if (typeof fbq === 'function') {
      fbq('track', 'InitiateCheckout', { currency:'USD', value: total });
    }
  </script>
</body>
</html>
